<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,Segoe UI,Roboto,Arial">
  <defs>
    <marker id="ar3" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5ec8cd"/>
    </marker>
  </defs>
  <style>
    .lbl{fill:#9aa7b4;font-size:13px} .ttl{fill:#e6edf3;font-size:16px;font-weight:700}
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
    .anchor{fill:#f5b14c;font-size:12px} .ok{fill:#7ee2a8;font-size:12px}
    .box{fill:#161b22;stroke:#30363d} .hd{fill:#e6edf3;font-size:14px;font-weight:700}
    .arr{stroke:#5ec8cd;stroke-width:2;fill:none;marker-end:url(#ar3)}
    .note{fill:#7d8894;font-size:11px} .cmd{fill:#5ec8cd;font-size:12px}
  </style>
  <rect x="0" y="0" width="900" height="400" fill="#0d1117"/>
  <text x="24" y="30" class="ttl">A PLATFORM is one asset, several workloads</text>
  <text x="24" y="54" class="cmd mono">$ goat machine enroll uas-01 --node-class PLATFORM --workloads sensor,effector,processor</text>

  <!-- the platform (one slot) -->
  <rect x="24" y="86" width="200" height="120" rx="8" class="box"/>
  <text x="40" y="112" class="hd">uas-01</text>
  <text x="40" y="134" class="lbl">one physical asset</text>
  <text x="40" y="156" class="anchor mono">one slot · CN = a1b2c3…</text>
  <text x="40" y="180" class="ok">= ONE quota unit</text>
  <text x="40" y="198" class="note">workloads are composition,</text>

  <!-- portal records -->
  <rect x="280" y="86" width="180" height="60" rx="8" style="fill:#0f1620;stroke:#30363d"/>
  <text x="296" y="110" class="hd">portal records</text>
  <text x="296" y="130" class="note mono">slots.workloads = [S,E,P]</text>
  <line x1="224" y1="120" x2="280" y2="120" class="arr"/>

  <!-- SPIRE mints -->
  <rect x="280" y="164" width="180" height="60" rx="8" style="fill:#0f1620;stroke:#30363d"/>
  <text x="296" y="188" class="hd">SPIRE mints SVIDs</text>
  <text x="296" y="208" class="note">the portal never proxies SPIRE</text>
  <line x1="370" y1="146" x2="370" y2="164" class="arr"/>

  <!-- the workloads -->
  <rect x="516" y="80" width="360" height="150" rx="8" fill="#0f1620" stroke="#30363d"/>
  <text x="534" y="106" class="hd">three workload SVIDs</text>
  <text x="534" y="132" class="ok mono">spiffe_id uas-01/sensor</text><text x="770" y="132" class="anchor mono">CN a1b2c3…</text>
  <text x="534" y="154" class="ok mono">spiffe_id uas-01/effector</text><text x="770" y="154" class="anchor mono">CN a1b2c3…</text>
  <text x="534" y="176" class="ok mono">spiffe_id uas-01/processor</text><text x="770" y="176" class="anchor mono">CN a1b2c3…</text>
  <text x="534" y="206" class="note">distinct spiffe_id (attribution) · SAME CN as the platform (compose by CN)</text>
  <line x1="460" y1="120" x2="516" y2="130" class="arr"/>
  <line x1="460" y1="194" x2="516" y2="170" class="arr"/>

  <!-- compose by CN explainer -->
  <rect x="24" y="252" width="852" height="124" rx="8" fill="#0f1620" stroke="#30363d"/>
  <text x="40" y="280" class="hd">Compose by CN — the wire admits by Common Name</text>
  <text x="40" y="306" class="lbl">Each workload SVID carries the <tspan class="anchor mono">platform's slot anchor as its CN</tspan>, so it writes under the platform's namespace exactly as the platform does.</text>
  <text x="40" y="328" class="lbl">The workloads are not separately wire-distinguishable — the <tspan class="ok mono">spiffe_id</tspan> is the SPIFFE attribution (which function), not a wire axis.</text>
  <text x="40" y="354" class="note">Each authority owns one class: the portal owns machine identity + the recorded composition; SPIRE owns the workload SVIDs. Neither proxies the other. The one deploy-time piece is each workload's runtime selector.</text>
</svg>
