<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,Segoe UI,Roboto,Arial">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5ec8cd"/>
    </marker>
  </defs>
  <style>
    .lbl{fill:#9aa7b4;font-size:13px} .ttl{fill:#e6edf3;font-size:16px;font-weight:700}
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
    .gate{fill:#f5b14c;font-size:12px;font-weight:700} .ok{fill:#7ee2a8;font-size:12px}
    .box{fill:#161b22;stroke:#30363d} .gatebox{fill:#2a2015;stroke:#f5b14c}
    .arr{stroke:#5ec8cd;stroke-width:2;fill:none;marker-end:url(#ar)}
    .hd{fill:#e6edf3;font-size:15px;font-weight:700} .note{fill:#7d8894;font-size:11px}
  </style>
  <rect x="0" y="0" width="900" height="430" fill="#0d1117"/>
  <text x="24" y="30" class="ttl">Two ceremonies, one grammar — the gates are the difference</text>

  <!-- PERSON lane -->
  <text x="24" y="66" class="hd">PERSON — a stranger to prove</text>
  <rect x="24"  y="80" width="120" height="46" rx="6" class="box"/>
  <text x="40"  y="102" class="lbl">sponsor</text><text x="40" y="118" class="note mono">invites a stranger</text>
  <rect x="176" y="80" width="120" height="46" rx="6" class="gatebox"/>
  <text x="196" y="102" class="gate">GATE 1</text><text x="196" y="118" class="note">sponsor vouches</text>
  <rect x="328" y="80" width="120" height="46" rx="6" class="gatebox"/>
  <text x="348" y="102" class="gate">GATE 2</text><text x="348" y="118" class="note">admin approves</text>
  <rect x="480" y="80" width="120" height="46" rx="6" class="box"/>
  <text x="496" y="102" class="lbl">mint</text><text x="496" y="118" class="note">runner writes identity</text>
  <line x1="144" y1="103" x2="176" y2="103" class="arr"/>
  <line x1="296" y1="103" x2="328" y2="103" class="arr"/>
  <line x1="448" y1="103" x2="480" y2="103" class="arr"/>
  <text x="632" y="98" class="lbl">planes minted:</text>
  <text x="632" y="118" class="ok mono">NetBird · Zenoh · Ory · .cbor</text>

  <!-- MACHINE lane -->
  <text x="24" y="200" class="hd">MACHINE — a vetted person's property</text>
  <rect x="24"  y="214" width="150" height="46" rx="6" class="box"/>
  <text x="40"  y="236" class="lbl">custodian</text><text x="40" y="252" class="note mono">holds quota N (from onboard)</text>
  <rect x="206" y="214" width="150" height="46" rx="6" style="fill:#12241a;stroke:#7ee2a8"/>
  <text x="222" y="236" class="ok">ZERO gates</text><text x="222" y="252" class="note">the quota IS the pre-auth</text>
  <rect x="388" y="214" width="150" height="46" rx="6" class="box"/>
  <text x="404" y="236" class="lbl">mint</text><text x="404" y="252" class="note">own slot + cert + custody</text>
  <line x1="174" y1="237" x2="206" y2="237" class="arr"/>
  <line x1="356" y1="237" x2="388" y2="237" class="arr"/>
  <text x="570" y="232" class="lbl">planes minted:</text>
  <text x="570" y="252" class="ok mono">NetBird · Zenoh   (no Ory, no .cbor)</text>

  <!-- the point -->
  <rect x="24" y="312" width="852" height="94" rx="8" fill="#0f1620" stroke="#30363d"/>
  <text x="40" y="340" class="hd">Why the asymmetry?</text>
  <text x="40" y="366" class="lbl">A person is a <tspan class="mono" fill="#f5b14c">stranger</tspan> — proving them takes two humans (sponsor + admin), and they get the fullest identity (a console login, a carried bundle).</text>
  <text x="40" y="388" class="lbl">A machine is <tspan class="mono" fill="#7ee2a8">already-vouched-for property</tspan> of a vetted person — their quota is the proof, so there are no gates, and it gets mesh + fabric identity only.</text>
</svg>
