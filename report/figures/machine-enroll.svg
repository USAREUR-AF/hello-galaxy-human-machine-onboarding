<svg viewBox="0 0 900 400" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,Segoe UI,Roboto,Arial">
  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#5ec8cd"/>
    </marker>
  </defs>
  <style>
    .lbl{fill:#9aa7b4;font-size:13px} .ttl{fill:#e6edf3;font-size:16px;font-weight:700}
    .mono{font-family:ui-monospace,Menlo,Consolas,monospace}
    .anchor{fill:#f5b14c;font-size:12px} .ok{fill:#7ee2a8;font-size:12px}
    .box{fill:#161b22;stroke:#30363d} .hd{fill:#e6edf3;font-size:14px;font-weight:700}
    .arr{stroke:#5ec8cd;stroke-width:2;fill:none;marker-end:url(#ar2)}
    .note{fill:#7d8894;font-size:11px} .cmd{fill:#5ec8cd;font-size:12px}
  </style>
  <rect x="0" y="0" width="900" height="400" fill="#0d1117"/>
  <text x="24" y="30" class="ttl">goat machine enroll — one command, atomic</text>
  <text x="24" y="54" class="cmd mono">$ goat machine enroll sensor-01 --node-class SENSOR-FEED --autonomy supervised</text>

  <!-- custodian -->
  <rect x="24" y="86" width="170" height="70" rx="8" class="box"/>
  <text x="40" y="112" class="hd">custodian</text>
  <text x="40" y="132" class="lbl">enrollment grant</text>
  <text x="40" y="150" class="anchor mono">quota 5 → 4  ·  aff=acme</text>

  <!-- gate check -->
  <rect x="250" y="86" width="150" height="70" rx="8" style="fill:#12241a;stroke:#7ee2a8"/>
  <text x="266" y="112" class="hd" fill="#7ee2a8">quota check</text>
  <text x="266" y="132" class="note">remaining &gt; 0 ?</text>
  <text x="266" y="150" class="ok">fail-closed, atomic</text>
  <line x1="194" y1="121" x2="250" y2="121" class="arr"/>

  <!-- what gets minted -->
  <rect x="456" y="72" width="420" height="220" rx="8" fill="#0f1620" stroke="#30363d"/>
  <text x="474" y="98" class="hd">the machine's OWN identity</text>
  <text x="474" y="126" class="lbl">▸ own slot</text><text x="560" y="126" class="anchor mono">&lt;uuid&gt;/&lt;taxonomy&gt;  (wire-distinguishable)</text>
  <text x="474" y="150" class="lbl">▸ Zenoh cert</text><text x="560" y="150" class="anchor mono">CN = the slot anchor</text>
  <text x="474" y="174" class="lbl">▸ custody edge</text><text x="560" y="174" class="ok mono">enrolled_by = custodian</text>
  <text x="474" y="198" class="lbl">▸ audit</text><text x="560" y="198" class="note mono">one custodian-attributed event</text>
  <text x="474" y="230" class="note">NOT minted: no .cbor, no Ory login —</text>
  <text x="474" y="248" class="note">a machine does not sign into web consoles.</text>
  <text x="474" y="276" class="ok">All of the above, or none — one transaction.</text>
  <line x1="400" y1="121" x2="456" y2="140" class="arr"/>

  <!-- revoke returns quota -->
  <rect x="24" y="316" width="852" height="60" rx="8" fill="#0f1620" stroke="#30363d"/>
  <text x="40" y="342" class="hd">Retire it later?</text>
  <text x="160" y="342" class="lbl">Revoke returns the quota <tspan class="ok">by construction</tspan> — remaining is derived (<tspan class="mono anchor">quota − live-enrolled</tspan>), never stored.</text>
  <text x="40" y="364" class="note">Infrastructure classes (MGMT-HOST/ZENOH/…) are the one exception: operator-gated, attributed to the custodian. Everything else is self-service.</text>
</svg>
